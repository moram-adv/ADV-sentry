<div class="app-shell">

  <nav class="top-nav" aria-label="Primary navigation">

    <!-- Brand -->
    <a class="brand" routerLink="/home" aria-label="Advanced SENTRY home">
      <div class="brand-mark" aria-hidden="true">
        <img src="shield-emblem.png" alt="" />
      </div>
      <span class="brand-name">Advanced <strong>SENTRY</strong></span>
    </a>

    <!-- Nav links -->
    <div class="nav-menu">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </a>
      <a routerLink="/locations" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        Locations
      </a>
      <a routerLink="/checklist-templates" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Checklist Templates
      </a>
    </div>

    <!-- Account -->
    <div class="account">
      <div class="account-info">
        <span class="account-role">Controller / Dispatcher</span>
        <span class="account-email">{{ userName() }}</span>
      </div>
      <div class="account-avatar" aria-hidden="true">
        {{ userName()?.charAt(0)?.toUpperCase() || 'U' }}
      </div>
      <button type="button" class="logout-btn" (click)="signOut()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Logout
      </button>
    </div>

  </nav>

  <main>
    <router-outlet />
  </main>

</div>
